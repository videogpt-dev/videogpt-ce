[project]
name = "infrelay-lite"
version = "0.1.0"
description = "Tiny self-host inference gateway for Kinoforge (OpenRouter + fal, env keys, no DB, no credits)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fal-client>=0.5",
    "openai>=1.40",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["infrelay_lite*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
