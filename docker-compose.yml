name: videogpt-self-hosted

services:
  infrelay-lite:
    build: ./services/infrelay-lite
    environment:
      FAL_KEY: ${FAL_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Provider "videogpt": your videogpt.dev API key; spends your account's credits.
      VIDEOGPT_API_KEY: ${VIDEOGPT_API_KEY:-}
      VIDEOGPT_CLOUD_URL: ${VIDEOGPT_CLOUD_URL:-https://infrelay.videogpt.dev}
    volumes:
      - whisper-cache:/cache/hf
    expose:
      - "8090"
    restart: unless-stopped

  kinoforge:
    build: ./apps/kinoforge
    environment:
      INFRELAY_URL: http://infrelay-lite:8090
      KINOFORGE_SHARED_ROOT: /data/output
      # error is quiet; debug or trace logs the full pipeline.
      KINOFORGE_LOG_LEVEL: ${KINOFORGE_LOG_LEVEL:-debug}
    volumes:
      - data:/data
    expose:
      - "8100"
    depends_on:
      - infrelay-lite
    restart: unless-stopped

  editor:
    build:
      context: ./studio
      dockerfile: apps/vcs-editor-service/Dockerfile
    environment:
      PORT: 3000
      OUTPUT_DIR: /data/output
    # Headless Chromium crashes on the 64MB default /dev/shm.
    shm_size: "1gb"
    volumes:
      - data:/data
    expose:
      - "3000"
    restart: unless-stopped

  core:
    build: ./apps/core
    environment:
      KINOFORGE_URL: http://kinoforge:8100
      INFRELAY_URL: http://infrelay-lite:8090
      EDITOR_URL: http://editor:3000
      CORE_DATA_DIR: /data
      KINOFORGE_SHARED_ROOT: /data/output
      KINOFORGE_LOG_LEVEL: ${KINOFORGE_LOG_LEVEL:-debug}
      MOMENT_FINDER: ${MOMENT_FINDER:-auto}
      MOMENT_FINDER_PROVIDER: ${MOMENT_FINDER_PROVIDER:-}
      MOMENT_FINDER_MODEL: ${MOMENT_FINDER_MODEL:-}
      STORY_TEXT_PROVIDER: ${STORY_TEXT_PROVIDER:-openrouter}
      STORY_TEXT_MODEL: ${STORY_TEXT_MODEL:-openai/gpt-4o-mini}
      STORY_IMAGE_PROVIDER: ${STORY_IMAGE_PROVIDER:-fal}
      STORY_IMAGE_MODEL: ${STORY_IMAGE_MODEL:-fal-ai/flux/schnell}
      STORY_TTS_PROVIDER: ${STORY_TTS_PROVIDER:-edge}
      STORY_TTS_VOICE: ${STORY_TTS_VOICE:-en-US-AriaNeural}
    volumes:
      - data:/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CORE_PORT:-8000}:8000"
    depends_on:
      - kinoforge
      - editor
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      CORE_URL: http://core:8000
      PORT: 3000
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-5173}:3000"
    depends_on:
      - core
    restart: unless-stopped

volumes:
  data:
  whisper-cache:
