name: videogpt-self-hosted

services:
  infrelay-lite:
    build: ./services/infrelay-lite
    environment:
      FAL_KEY: ${FAL_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - whisper-cache:/cache/hf
    expose:
      - "8090"
    restart: unless-stopped

  kinoforge:
    build: ./apps/kinoforge
    environment:
      INFRELAY_URL: http://infrelay-lite:8090
      KINOFORGE_SHARED_ROOT: /data/output
    volumes:
      - data:/data
    expose:
      - "8100"
    depends_on:
      - infrelay-lite
    restart: unless-stopped

  core:
    build: ./apps/core
    environment:
      KINOFORGE_URL: http://kinoforge:8100
      INFRELAY_URL: http://infrelay-lite:8090
      CORE_DATA_DIR: /data
      KINOFORGE_SHARED_ROOT: /data/output
    volumes:
      - data:/data
    ports:
      - "${CORE_PORT:-8000}:8000"
    depends_on:
      - kinoforge
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_CORE_URL: ${VITE_CORE_URL:-http://localhost:8000}
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    depends_on:
      - core
    restart: unless-stopped

volumes:
  data:
  whisper-cache:
