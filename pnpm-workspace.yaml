packages:
  - apps/*
  - packages/*
  - studio/apps/*
  - studio/packages/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  "@types/react": ^19
  "@types/react-dom": ^19
  react: ^19
  react-dom: ^19
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.9
  vite-plus: latest
  lucide-react: ^1.22.0
  '@headlessui/react': ^2.2.10
  sonner: ^2.0.7
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  shadcn: ^4.13.1
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  radix-ui: ^1.6.2
  '@fontsource-variable/geist': ^5.3.0
  vaul: ^1.1.2
  next-themes: ^0.4.6
  zod: ^4.4.3
  '@base-ui/react': ^1.7.0
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  cmdk: ^1.1.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  workerd: true
